    <rect x="36" y="358" width="5" height="44" fill="#221006" rx="2"/>
    <ellipse cx="38" cy="348" rx="20" ry="16" fill="#1A3D26"/>
    <ellipse cx="30" cy="343" rx="13" ry="11" fill="#1F4830"/>
