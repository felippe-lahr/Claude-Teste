  <ellipse cx="738" cy="399" rx="18" ry="15" fill="#2F6A47"/>
  <ellipse cx="766" cy="396" rx="20" ry="16" fill="#1F5035"/>
  <ellipse cx="718" cy="408" rx="15" ry="12" fill="#2F6A47"/>
  <ellipse cx="751" cy="390" rx="14" ry="12" fill="#3D8E60"/>

