<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="skyGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"  stop-color="#040A16"/>
      <stop offset="30%" stop-color="#0B1D40"/>
      <stop offset="58%" stop-color="#163268"/>
      <stop offset="75%" stop-color="#7A420E"/>
      <stop offset="88%" stop-color="#C27020"/>
      <stop offset="100%" stop-color="#E09030"/>
    </linearGradient>

    <radialGradient id="sunGlow" cx="50%" cy="67%" r="35%">
      <stop offset="0%"   stop-color="#F0A830" stop-opacity="0.95"/>
      <stop offset="35%"  stop-color="#C06810" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#0B1D40"  stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="moonGlow" cx="70%" cy="13%" r="9%">
      <stop offset="0%"   stop-color="#C8E4FF" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#163268"  stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="groundGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#7A5820"/>
      <stop offset="40%"  stop-color="#553C14"/>
      <stop offset="100%" stop-color="#221408"/>
    </linearGradient>

    <linearGradient id="bottomFade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#1A0C06" stop-opacity="0"/>
      <stop offset="100%" stop-color="#060402" stop-opacity="0.85"/>
    </linearGradient>

    <filter id="blur2">
      <feGaussianBlur stdDeviation="2"/>
    </filter>
    <filter id="blur4">
      <feGaussianBlur stdDeviation="4"/>
    </filter>
  </defs>

  <!-- ── SKY ── -->
  <rect width="800" height="900" fill="url(#skyGrad)"/>
  <rect width="800" height="900" fill="url(#sunGlow)"/>
  <rect width="800" height="900" fill="url(#moonGlow)"/>

  <!-- Crescent moon -->
  <circle cx="558" cy="105" r="20" fill="#EAF4FF" opacity="0.92"/>
  <circle cx="566" cy="100" r="18" fill="#040A16" opacity="0.88"/>

  <!-- Stars -->
  <g fill="white">
    <circle cx="72"  cy="38"  r="1.3" opacity="0.85"/>
    <circle cx="140" cy="22"  r="0.9" opacity="0.65"/>
    <circle cx="195" cy="52"  r="1.1" opacity="0.75"/>
    <circle cx="305" cy="16"  r="1.6" opacity="0.90"/>
    <circle cx="372" cy="42"  r="0.9" opacity="0.55"/>
    <circle cx="428" cy="28"  r="1.1" opacity="0.75"/>
    <circle cx="488" cy="14"  r="1.3" opacity="0.85"/>
    <circle cx="516" cy="58"  r="0.8" opacity="0.50"/>
    <circle cx="618" cy="26"  r="1.0" opacity="0.65"/>
    <circle cx="678" cy="46"  r="1.4" opacity="0.80"/>
    <circle cx="728" cy="20"  r="0.9" opacity="0.60"/>
    <circle cx="762" cy="62"  r="1.1" opacity="0.70"/>
    <circle cx="48"  cy="86"  r="0.8" opacity="0.50"/>
    <circle cx="158" cy="76"  r="1.0" opacity="0.62"/>
    <circle cx="268" cy="68"  r="0.9" opacity="0.52"/>
    <circle cx="348" cy="84"  r="1.2" opacity="0.72"/>
    <circle cx="638" cy="70"  r="0.9" opacity="0.55"/>
    <circle cx="708" cy="88"  r="1.1" opacity="0.65"/>
    <circle cx="32"  cy="118" r="0.7" opacity="0.45"/>
    <circle cx="420" cy="110" r="0.8" opacity="0.50"/>
